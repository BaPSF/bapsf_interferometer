[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bapsf-interferometer"
version = "0.1.0"
description = "BaPSF microwave interferometer acquisition and analysis tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "LAPD/BaPSF contributors"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy",
  "scipy",
  "h5py",
  "matplotlib",
  "adios2",
  "PyNaCl",
  # LeCroy + Rigol drivers (interf_raw.py). >= 0.4.1: wavedesc_trigger_timestamp reads the WAVEDESC trigger
  # time as America/Los_Angeles (0.4.0 read it as UTC, 7-8 h off), and tzdata comes with it on Windows.
  # 0.4.2: LeCroyScope(n_channels=) skips channel detection (~5 s per open on the HDO4104), and TCP_NODELAY.
  "lab-scopes @ git+https://github.com/hjia94/lab_scopes.git@v0.4.2",
]

[project.optional-dependencies]
compression = ["blosc2>=4,<5"]
# Floors; constraints.txt pins the tested EPICS stack.
ioc = ["softioc>=4.7.2"]
# EPICS clients: pyepics (CA; the tests read the IOC back over it) and p4p (PVA; interf_store and the PVA tests).
clients = ["pyepics>=3.5.10", "p4p>=4.3.0"]

[project.scripts]
interf-stream-consumer = "streamer.consumer:main"
diag-ioc = "diag_ioc.__main__:main"
interf-store = "interf_store:main"
interf-wanstream-consumer = "streamer.wanstreamer_consumer:main"
interf-stream-analyze = "streamer.analyze_remote_experiment:main"

[tool.setuptools]
# Flat layout with several top-level modules: setuptools refuses to auto-discover them. The explicit
# lists name every module and package; a new one must be added here.
py-modules = ["interf_main", "interf_raw", "interf_analysis", "interf_file", "interf_payload", "interf_shot", "interf_archive",
              "interf_ioc", "interf_store"]
packages = ["diag_ioc", "interf_sim", "streamer"]

[tool.setuptools.package-data]
streamer = ["conf/*.conf"]
