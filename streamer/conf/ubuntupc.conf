[server]
host = ubuntupc
socket_transport = direct
working_directory = /home/pnorbert/Software/LAPD/bapsf_interferometer
python = /home/pnorbert/Software/LAPD/.venv/bin/python3
script = streamer/consumer.py

connection_file = conn.json
output_directory = output
file_interval_seconds = 3600
stdout_log = ConsumerSingleSocket.stdout.log
pid_file = ConsumerSingleSocket.pid
public_key = keys/testkey.pub
allow_ip_range = 192.168.1.0/24
port = 8501-8501
bind_host = 0.0.0.0
advertise_host = 192.168.1.7

# A missing acknowledgement for this long is treated as a stalled connection.
socket_timeout_seconds = 30
startup_timeout_seconds = 30
retry_delay_seconds = 1
# Zero retries forever; use a positive number to make an outage fatal.
max_relaunch_attempts = 0

ntfy_topic_info = mock_data_streamer_nersc_info
ntfy_topic_alert = mock_data_streamer_nersc_alert
